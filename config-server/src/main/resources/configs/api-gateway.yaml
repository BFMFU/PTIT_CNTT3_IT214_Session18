server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/api/auth/**

            - id: customer-service-customers
              uri: lb://customer-service
              predicates:
                - Path=/api/customers/**

            - id: customer-service-staffs
              uri: lb://customer-service
              predicates:
                - Path=/api/staffs/**

            - id: customer-service-account-types
              uri: lb://customer-service
              predicates:
                - Path=/api/account-types/**

            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/api/accounts/**

            - id: transaction-service
              uri: lb://transaction-service
              predicates:
                - Path=/api/transactions/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
